<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 420" width="100%" height="100%">
  <defs>
    <!-- Realistic Blue Cylinder Gradient for 7kg -->
    <linearGradient id="butaneBodyGrad7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002d62" />
      <stop offset="18%" stop-color="#004b99" />
      <stop offset="42%" stop-color="#0066cc" />
      <stop offset="65%" stop-color="#0052a3" />
      <stop offset="88%" stop-color="#003366" />
      <stop offset="100%" stop-color="#001f3f" />
    </linearGradient>

    <!-- Metallic Handle / Shroud Gradient -->
    <linearGradient id="shroudGrad7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003066" />
      <stop offset="25%" stop-color="#0055aa" />
      <stop offset="50%" stop-color="#006cd9" />
      <stop offset="75%" stop-color="#004488" />
      <stop offset="100%" stop-color="#002244" />
    </linearGradient>

    <!-- Valve Brass / Gold -->
    <linearGradient id="brassGrad7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Shadow -->
    <radialGradient id="dropShadow7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.45)" />
      <stop offset="60%" stop-color="rgba(15, 23, 42, 0.15)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)" />
    </radialGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="140" cy="405" rx="78" ry="11" fill="url(#dropShadow7)" />

  <!-- Foot Ring / Base -->
  <path d="M 80 385 C 80 375, 200 375, 200 385 C 200 397, 80 397, 80 385 Z" fill="#002244" />
  <ellipse cx="140" cy="386" rx="58" ry="7" fill="#001830" />

  <!-- Cylinder Main Body (Slightly more compact height for 7kg) -->
  <path d="
    M 70 180
    C 70 120, 210 120, 210 180
    L 210 345
    C 210 385, 70 385, 70 345
    Z
  " fill="url(#butaneBodyGrad7)" />

  <!-- Body Specular Highlight -->
  <path d="
    M 104 150
    C 104 135, 126 135, 126 150
    L 126 360
    C 126 370, 104 370, 104 360
    Z
  " fill="white" opacity="0.12" />

  <!-- Weld Seam Ring -->
  <ellipse cx="140" cy="278" rx="69" ry="3.8" fill="none" stroke="#002d62" stroke-width="2" opacity="0.6" />
  <ellipse cx="140" cy="277" rx="69" ry="3.6" fill="none" stroke="#0077ee" stroke-width="1.2" opacity="0.4" />

  <!-- Valve Assembly -->
  <rect x="133" y="100" width="14" height="22" rx="2" fill="url(#brassGrad7)" />
  <circle cx="140" cy="97" r="7" fill="#dc2626" />
  <circle cx="140" cy="97" r="4" fill="#991b1b" />

  <!-- Top Handle Shroud Collar -->
  <path d="
    M 90 140
    C 90 78, 190 78, 190 140
    C 190 155, 90 155, 90 140
    Z
  " fill="url(#shroudGrad7)" stroke="#002244" stroke-width="2" />

  <!-- Shroud Cutouts -->
  <rect x="106" y="98" width="68" height="22" rx="11" fill="#001f3f" stroke="#001830" stroke-width="2" />
  <ellipse cx="140" cy="109" rx="30" ry="8" fill="#0a101d" />

  <!-- Top Rim Edge -->
  <path d="M 98 88 C 112 80, 168 80, 182 88" fill="none" stroke="#4da6ff" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

  <!-- Front Brand Graphics (Calor Gas White Typography & Logo) -->
  <g transform="translate(140, 215)">
    <!-- Calor Flame Logo Icon -->
    <path d="
      M 0 -36
      C 9 -25, 11 -14, 0 -3
      C -11 -14, -9 -25, 0 -36
      Z
    " fill="#ffffff" />
    <circle cx="0" cy="-20" r="4.5" fill="#0052a3" />

    <!-- Brand Name CALOR -->
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="23" fill="#ffffff" letter-spacing="1">
      CALOR
    </text>
    <text x="0" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="2">
      Gas
    </text>

    <!-- Subtitle: 7kg Butane -->
    <rect x="-52" y="34" width="104" height="24" rx="6" fill="rgba(0, 30, 70, 0.7)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1" />
    <text x="0" y="51" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#ffffff">
      7kg Butane
    </text>
  </g>
</svg>
